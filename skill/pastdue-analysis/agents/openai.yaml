interface:
  display_name: "PastDue Analysis"
  short_description: "PastDue analysis, structured Vendor ETA reports, and Ops/Demo HTML companion after DAILY/TEST"
  brand_color: "#B45309"
  default_prompt: "Use $pastdue-analysis for flexible current/snapshot/pair/range analysis or a US/CA weekday report; start test / 开始测试 forces applicable diagnostics in the request language. After a successful standard DAILY/TEST Markdown report, follow $pastdue-html-report for one Ops/Demo HTML file from the same verified bindings."

dependencies:
  tools:
    - type: "mcp"
      value: "open-altlas"
      description: "Open Atlas graph access to governed PastDue ClickHouse facts"

policy:
  allow_implicit_invocation: true
